[project]
name = "sports-ai-analytics"
version = "2.1.0"
description = "Plataforma profesional de análisis estadístico deportivo con IA"
requires-python = ">=3.12"
authors = [{ name = "Sports AI Team" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
